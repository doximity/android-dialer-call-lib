apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    namespace "com.doximity.callwithdoxdialer"
    compileSdk 35
    defaultConfig {
        applicationId "com.doximity.callwithdoxdialer"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 3
        versionName "2.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.core:core-ktx:1.16.0'
    androidTestImplementation('androidx.test.espresso:espresso-core:3.1.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    implementation 'androidx.appcompat:appcompat:1.6.1'
    testImplementation 'junit:junit:4.13.2'
    implementation 'com.google.android.material:material:1.9.0'

    //Import CallWithDoxDialerLib directly into gradle
    // TODO update this version number!
    implementation 'com.github.doximity:android-dialer-call-lib:v1.1.1'

    //You can also import CallWithDoxDialerLib as a new module
    //implementation project(':CallWithDoxDialerLib')
}
